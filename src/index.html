<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./assets/icons/favicon.ico">
  <title>Test Task</title>
</head>

<body>
  <div class="greeting">
    <img id="logo" src="./assets/svg/apple_grey.svg" alt="logo" width="80">
  </div>

  <main class="main-content">
    <section class="notification">
      <img src="./assets/svg/settings.svg" alt="settings" width="80">
      <div class="notification_device">
        <h1 class="notification_brand font14">Banana</h1>
        <p class="notification_model font14">Nokia 21 PRO</p>
        <p class="notification_status font14">Result: System Optimal</p>
      </div>
      <button class="notification_action font14">Action Required</button>
    </section>

    <section class="settings">
      <div class="settings_item font18">
        <img src="./assets/svg/warning_transparent.svg" alt="warning" width="40">
        <span class="settings_text">Default information</span>
        <span class="settings_value">14</span>
      </div>

      <div class="settings_item font18">
        <img src="./assets/svg/warning_transparent.svg" alt="warning" width="40">
        <span class="settings_text">Default information</span>
        <span class="settings_value">6</span>
      </div>

      <div class="settings_item font18">
        <img src="./assets/svg/warning_transparent.svg" alt="warning" width="40">
        <span class="settings_text">Default information</span>
        <span class="settings_value">8</span>
      </div>

      <div class="settings_item font18">
        <img src="./assets/svg/warning_transparent.svg" alt="warning" width="40">
        <span class="settings_text">Default information</span>
        <span class="settings_value">2</span>
      </div>
    </section>

    <section class="card">
      <div class="card_item font17">
        <span class="card_text">Default information</span>
        <span class="card_value"></span>
        <img src="./assets/svg/greater.svg" alt="warning" width="30">
      </div>

      <div class="card_item font17">
        <span class="card_text">Default information</span>
        <span class="card_value"></span>
        <img src="./assets/svg/greater.svg" alt="warning" width="30">
      </div>

      <div class="card_item font17">
        <span class="card_text">Default information</span>
        <span class="card_value"></span>
        <img src="./assets/svg/greater.svg" alt="warning" width="30">
      </div>
    </section>

    <section class="iphone">
      <div class="iphone_device">
        <img src="./assets/svg/iphone.svg" alt="iphone" width="30">
        <div class="iphone_info">
          <span class="iphone_type font18">Default device</span>
          <span class="iphone_description font12">-</span>
        </div>
      </div>
    </section>

    <section class="action">
      <button class="action_button font17">Default Click</button>
    </section>

  </main>

</body>
<script type="module" src="script.js"></script>

</html>
